# Fallback auto-merge for when the AI review loop is switched off (AI_REVIEW_ENABLED=false).
# Normally ai-review.yml turns auto-merge on, and only after a clean review.
# Requires AUTO_MERGE_ENABLED=true and the main ruleset (required checks), or it would merge at once.
name: pr-automation

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review]

permissions:
  contents: read

jobs:
  enable-auto-merge:
    name: Enable auto-merge (review loop off)
    if: >-
      vars.AI_REVIEW_ENABLED == 'false' &&
      vars.AUTO_MERGE_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: gh pr merge --auto --squash
        env:
          # A PAT so the merge to main triggers the push workflows (GITHUB_TOKEN merges don't).
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --auto --squash --delete-branch
