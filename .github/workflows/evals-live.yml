# Advisory live evals: real API calls under a dollar budget. Never a required check.
# Runs on demand, nightly, on PRs labeled eval/run, and automatically on PRs that touch the
# AI surface (prompts, agent, evals, room model, fixtures) — judged on the whole PR, so every push to
# such a PR re-runs (capped per run). If the file list can't be read, it runs (fails toward measuring). Skips cleanly when the secret is unset.
name: evals-live

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "41 7 * * *"

permissions:
  contents: read

# Unrelated label events get their own group, so they can't cancel an AI-surface run in flight.
concurrency:
  group: evals-live-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'auto' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (AI-surface diff or eval/run label)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$SAME_REPO" != "true" ]; then echo "Fork PR — no secrets, skipped."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$ACTION" = "labeled" ]; then
            [ "$LABEL" = "eval/run" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$RUNNER_TEMP/changed.txt"
          # Whole-PR file list, not just the latest push: a newer push cancels the older run (concurrency),
          # so the newer run must still see an earlier AI-surface change and run.
          ok=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > "$files" && echo y || echo n)
          if [ "$ok" != "y" ]; then
            echo "::warning::Could not list changed files — running live evals to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE '^(prompts/|src/server/agent/|src/domain/|evals/|fixtures/)' "$files"; then
            echo "AI-surface change — running live evals."; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No AI-surface change — live evals skipped."; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  live-agent:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}
      EVAL_RUN_BUDGET_USD: "5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run agent on the golden set
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY not set — skipped"; exit 0; fi
          pnpm evals:live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-transcripts
          path: evals/transcripts/
          if-no-files-found: warn

  judge:
    needs: live-agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-transcripts
          path: evals/transcripts/
        continue-on-error: true
      - name: Judge the transcripts (different model than the agent)
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY not set — skipped"; exit 0; fi
          pnpm evals:judge
