# Advisory code-quality signals. Not required checks.
name: quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duplicates:
    name: Duplicate code (jscpd)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: jscpd (fail above 5% duplication)
        run: >
          npx --yes jscpd@5.4.1
          --threshold 5 --min-lines 8 --min-tokens 50
          --format "typescript,tsx"
          --reporters "console,markdown" --output jscpd-report
          --ignore "**/*.test.ts,**/*.test.tsx,**/__fixtures__/**,**/node_modules/**,**/dist/**"
          src evals e2e
      - name: Job summary
        if: always()
        run: cat jscpd-report/jscpd-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reporter=html
      - name: Job summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage (src/domain, gate 90/85)", "| Metric | % | Covered |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
