# Deletes remote branches whose PR merged and that have no open PR. Never touches main.
name: branch-sweep

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: branch-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Delete merged branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deleted=0 kept_open=0 kept_unmerged=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            states=$(gh pr list --repo "$REPO" --head "$branch" --state all --json state -q '.[].state')
            open=$(printf '%s\n' "$states" | grep -c '^OPEN$' || true)
            merged=$(printf '%s\n' "$states" | grep -c '^MERGED$' || true)
            if [ "$open" -gt 0 ]; then echo "keep  $branch (open PR)"; kept_open=$((kept_open + 1)); continue; fi
            if [ "$merged" -eq 0 ]; then echo "keep  $branch (no merged PR)"; kept_unmerged=$((kept_unmerged + 1)); continue; fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"; then
              echo "del   $branch"; deleted=$((deleted + 1))
            else
              echo "warn  $branch delete failed (already gone?)"
            fi
          done < <(gh api "repos/$REPO/branches" --paginate -q '.[].name' | grep -vx 'main')
          echo "Sweep: deleted=$deleted kept(open PR)=$kept_open kept(unmerged)=$kept_unmerged" | tee -a "$GITHUB_STEP_SUMMARY"
