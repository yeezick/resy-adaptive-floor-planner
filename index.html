<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptive Floor Planner — concept prototype</title>
    <meta name="color-scheme" content="dark light" />
    <!-- Sets the theme before first paint. If a CSP is added, allow this script by hash. -->
    <script>
      // Apply the saved theme before first paint (dark by default). Storage can throw.
      (function () {
        var t = "dark";
        try {
          var s = window.localStorage.getItem("afp-theme");
          if (s === "light" || s === "dark") t = s;
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
